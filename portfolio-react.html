<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Waqas Ali — AI Engineer</title>
<meta name="description" content="I build intelligent systems that see, learn & decide."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<!-- React + Babel via CDN — no build step needed -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* ─── GLOBAL RESET ──────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#030407;
  color:#e2e8f0;
  font-family:'Inter',sans-serif;
  font-weight:300;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0a0b10}
::-webkit-scrollbar-thumb{background:#2a2d3a;border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#4facfe66}

/* ─── LOADER ────────────────────────────────── */
.loader{
  position:fixed;inset:0;z-index:9999;
  background:#030407;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;
  transition:opacity .8s ease,visibility .8s ease;
}
.loader.out{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{
  font-family:'Playfair Display',serif;
  font-size:28px;font-weight:400;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.02em;
}
.loader-dots{display:flex;gap:8px}
.loader-dot{
  width:5px;height:5px;border-radius:50%;
  background:#4facfe;opacity:.3;
  animation:ldot .9s ease-in-out infinite;
}
.loader-dot:nth-child(2){animation-delay:.15s}
.loader-dot:nth-child(3){animation-delay:.3s}
@keyframes ldot{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}

/* ─── NAV ───────────────────────────────────── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:68px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,4vw,56px);
  background:rgba(3,4,7,.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .3s;
}
.nav-brand{display:flex;flex-direction:column;gap:2px}
.nav-name{
  font-size:14px;font-weight:500;color:#f8f9ff;
  letter-spacing:-.01em;
}
.nav-role{font-size:11px;color:#64748b;letter-spacing:.03em}

.nav-pill{
  display:flex;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:100px;padding:4px;gap:2px;
}
.pill-btn{
  padding:7px 22px;border-radius:100px;
  font-size:13px;font-weight:400;font-family:'Inter',sans-serif;
  color:#8892b0;cursor:pointer;border:none;
  background:transparent;
  transition:color .25s,background .25s;
}
.pill-btn:hover{color:#f8f9ff}
.pill-btn.active{
  background:linear-gradient(135deg,#4facfe22,#00f2fe22);
  color:#f8f9ff;
  border:1px solid rgba(79,172,254,.2);
}

.nav-links{display:flex;align-items:center;gap:24px}
.nav-link{
  font-size:13px;color:#94a3b8;
  display:flex;align-items:center;gap:4px;
  transition:color .2s;
}
.nav-link:hover{color:#f8f9ff}
.nav-link svg{width:10px;height:10px;opacity:.7}

/* ─── PAGE TRANSITION ───────────────────────── */
.page{display:none;min-height:calc(100vh - 68px);padding-top:68px}
.page.active{display:block}
@keyframes pageFade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.page.active{animation:pageFade .5s ease both}

/* ─── HERO / WORK PAGE ──────────────────────── */
.work-page{padding-bottom:80px}

/* Browser chrome hero */
.browser-outer{
  margin:32px clamp(16px,4vw,56px) 0;
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 32px 80px rgba(0,0,0,.6);
  position:relative;
}
.browser-outer::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(79,172,254,.04),rgba(0,242,254,.02));
  pointer-events:none;z-index:1;
}
.browser-bar{
  height:42px;
  background:#111318;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.b-dots{display:flex;gap:7px}
.b-dot{width:10px;height:10px;border-radius:50%}
.browser-content{
  background:linear-gradient(160deg,#0c0e18 0%,#080a12 60%,#050609 100%);
  padding:clamp(48px,8vw,88px) clamp(28px,6vw,72px) clamp(48px,8vw,96px);
  position:relative;
  overflow:hidden;
}
.browser-content::after{
  content:'';
  position:absolute;
  top:-120px;right:-120px;
  width:480px;height:480px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(79,172,254,.06) 0%,transparent 70%);
  pointer-events:none;
}
.hero-hl{
  font-family:'Playfair Display',serif;
  font-size:clamp(42px,7vw,88px);
  font-weight:400;line-height:1.06;
  letter-spacing:-.025em;
  color:#f8f9ff;
  margin-bottom:40px;
  position:relative;z-index:1;
}
.hero-hl em{
  font-style:italic;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-meta{
  display:flex;justify-content:flex-end;
  position:relative;z-index:1;
}
.hero-meta-inner{text-align:right}
.hero-location{
  font-size:clamp(14px,1.8vw,17px);
  color:#94a3b8;line-height:1.7;
}
.hero-uni{
  font-size:13px;color:#4a5568;
  margin-top:4px;letter-spacing:.02em;
}

/* Work cards */
.work-section{padding:60px clamp(16px,4vw,56px) 0}
.section-eyebrow{
  font-size:11px;text-transform:uppercase;letter-spacing:.18em;
  color:#4a5568;margin-bottom:28px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;gap:10px;
}
.eyebrow-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(79,172,254,.15),transparent)}

.projects-grid{display:flex;flex-direction:column;gap:20px}
.project-card{
  border-radius:16px;
  border:1px solid rgba(255,255,255,.06);
  overflow:hidden;
  cursor:pointer;
  background:#0c0e14;
  transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .4s;
  position:relative;
}
.project-card::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(79,172,254,.03),transparent);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.project-card:hover{
  transform:translateY(-3px);
  border-color:rgba(79,172,254,.2);
  box-shadow:0 16px 48px rgba(0,0,0,.5),0 0 0 1px rgba(79,172,254,.05);
}
.project-card:hover::before{opacity:1}

.card-header{
  padding:24px 28px 20px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.02) 0%,transparent 100%);
}
.card-meta{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:#4facfe88;margin-bottom:7px;
}
.card-title{
  font-size:clamp(16px,2vw,20px);font-weight:400;color:#f0f4ff;
  margin-bottom:8px;letter-spacing:-.01em;
}
.card-desc{
  font-size:13px;color:#8892b0;line-height:1.6;max-width:600px;
}
.card-arrow{
  color:#4facfe44;font-size:20px;flex-shrink:0;
  transition:transform .3s,color .3s;margin-top:2px;
}
.project-card:hover .card-arrow{transform:translate(3px,-3px);color:#4facfe}

.card-preview{
  background:#080a10;
  border-top:1px solid rgba(255,255,255,.04);
  line-height:0;
}
.card-preview svg{width:100%;height:auto;display:block}

/* Fade-in on reveal */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:none}
}
.fade-in{animation:fadeUp .6s ease both}
.fade-in-1{animation-delay:.05s}
.fade-in-2{animation-delay:.12s}
.fade-in-3{animation-delay:.19s}
.fade-in-4{animation-delay:.26s}
.fade-in-5{animation-delay:.33s}

/* ─── INFO PAGE ─────────────────────────────── */
.info-page{padding-bottom:80px}
.info-inner{
  max-width:1060px;margin:0 auto;
  padding:48px clamp(16px,4vw,56px) 80px;
}

.about-eyebrow{
  display:flex;align-items:center;gap:10px;
  font-size:11px;text-transform:uppercase;letter-spacing:.18em;
  color:#4facfe;margin-bottom:52px;
}
.eyebrow-dot{
  width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  box-shadow:0 0 8px #4facfe88;
}

/* Photo + bio section */
.bio-section{
  display:grid;grid-template-columns:1fr 380px;
  gap:64px;align-items:center;
  margin-bottom:80px;
}
.bio-text-main{
  font-family:'Playfair Display',serif;
  font-size:clamp(22px,2.8vw,34px);
  font-weight:400;line-height:1.35;
  color:#e8edf8;letter-spacing:-.015em;
  margin-bottom:28px;
}
.bio-text-main em{font-style:italic;color:#4facfe}
.bio-body{font-size:15px;color:#8892b0;line-height:1.85;font-weight:300}
.bio-body p{margin-bottom:16px}
.bio-body p:last-child{margin-bottom:0}

/* Photo card */
.photo-card{
  position:relative;
  border-radius:20px;overflow:hidden;
  aspect-ratio:3/4;
}
.photo-card::before{
  content:'';
  position:absolute;inset:-2px;z-index:-1;
  border-radius:22px;
  background:linear-gradient(135deg,#4facfe44,#00f2fe22,transparent,#4facfe22);
}
.photo-card::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(3,4,7,.6) 0%,transparent 50%);
  pointer-events:none;z-index:1;
}
.photo-card img{
  width:100%;height:100%;
  object-fit:cover;object-position:center top;
  display:block;
  transition:transform .6s cubic-bezier(.25,.46,.45,.94);
}
.photo-card:hover img{transform:scale(1.04)}
.photo-badge{
  position:absolute;bottom:16px;left:16px;z-index:2;
  background:rgba(3,4,7,.85);
  backdrop-filter:blur(12px);
  border:1px solid rgba(79,172,254,.2);
  border-radius:10px;
  padding:10px 14px;
}
.photo-badge-name{font-size:13px;font-weight:500;color:#f0f4ff;margin-bottom:2px}
.photo-badge-role{font-size:11px;color:#4facfe;letter-spacing:.04em}

/* Second bio row */
.bio-row2{
  display:grid;grid-template-columns:360px 1fr;
  gap:64px;align-items:center;
  margin-bottom:80px;
  padding:40px;
  border-radius:16px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.05);
}
.stat-stack{display:flex;flex-direction:column;gap:16px}
.stat-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  border-radius:10px;
  background:rgba(79,172,254,.04);
  border:1px solid rgba(79,172,254,.08);
  transition:border-color .2s,background .2s;
}
.stat-item:hover{background:rgba(79,172,254,.07);border-color:rgba(79,172,254,.15)}
.stat-icon{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.stat-icon.blue{background:rgba(79,172,254,.1)}
.stat-icon.green{background:rgba(34,197,94,.1)}
.stat-icon.yellow{background:rgba(251,191,36,.1)}
.stat-label{font-size:12px;color:#64748b;margin-bottom:2px}
.stat-value{font-size:14px;font-weight:400;color:#e2e8f0}

/* Section label */
.sec-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.18em;
  color:#64748b;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.05);
  margin-bottom:28px;
  display:flex;align-items:center;gap:8px;
}

/* Skills */
.skills-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;margin-bottom:56px;
}
.skill-group{
  padding:20px;border-radius:12px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.05);
  transition:border-color .2s,background .2s;
}
.skill-group:hover{
  background:rgba(79,172,254,.03);
  border-color:rgba(79,172,254,.1);
}
.skill-group-label{
  font-size:12px;font-weight:500;color:#94a3b8;
  margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;
}
.skill-tags{display:flex;flex-wrap:wrap;gap:7px}
.skill-tag{
  font-size:12px;padding:5px 11px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:5px;color:#94a3b8;
  transition:all .2s;cursor:default;
}
.skill-tag:hover{
  background:rgba(79,172,254,.08);
  border-color:rgba(79,172,254,.25);
  color:#c8d8f0;
}

/* Certs */
.certs-list{display:flex;flex-direction:column;gap:0}
.cert-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
  gap:16px;
  transition:padding-left .25s;
}
.cert-item:hover{padding-left:8px}
.cert-item:last-child{border-bottom:none}
.cert-dot{
  width:7px;height:7px;border-radius:50%;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  flex-shrink:0;
  box-shadow:0 0 6px #4facfe66;
}
.cert-info{flex:1}
.cert-name{font-size:15px;font-weight:400;color:#e8edf8;margin-bottom:3px}
.cert-org{font-size:11px;color:#64748b;letter-spacing:.07em;text-transform:uppercase}
.cert-id{font-size:11px;color:#4facfe55;font-family:monospace;letter-spacing:.05em;flex-shrink:0}

/* ─── FOOTER ────────────────────────────────── */
.footer{
  padding:40px clamp(16px,4vw,56px);
  border-top:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:20px;
  background:rgba(255,255,255,.01);
}
.footer-left{}
.footer-name{font-size:14px;font-weight:500;color:#e2e8f0;margin-bottom:3px}
.footer-copy{font-size:11px;color:#4a5568}
.footer-links{display:flex;gap:20px}
.footer-link{font-size:13px;color:#64748b;transition:color .2s}
.footer-link:hover{color:#f8f9ff}

/* ─── RESPONSIVE ────────────────────────────── */
@media(max-width:768px){
  .nav-links{display:none}
  .bio-section{grid-template-columns:1fr;gap:36px}
  .bio-section .photo-card{max-width:300px;margin:0 auto}
  .bio-row2{grid-template-columns:1fr;gap:28px;padding:24px}
  .skills-grid{grid-template-columns:1fr 1fr}
  .cert-id{display:none}
}
@media(max-width:480px){
  .skills-grid{grid-template-columns:1fr}
  .nav-pill{display:none}
}
</style>
</head>

}
